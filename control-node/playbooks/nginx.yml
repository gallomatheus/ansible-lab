- hosts: app
  become: true

  tasks:

    - name: Instalar nginx
      apt:
        name: nginx
        state: present

    - name: Garantir nginx iniciado
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Criar página HTML
      copy:
        dest: /var/www/html/index.html
        content: |
          <h1>Servidor App01 configurado pelo Ansible</h1>